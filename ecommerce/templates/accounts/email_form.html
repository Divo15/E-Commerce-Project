{% extends 'accounts/layout.html' %}
{% block account_content %}
<h1>{{ title }}</h1><p class="account-intro">{{ intro }}</p>
<form method="post" class="commerce-form">{% csrf_token %}<label for="account-email">Email address</label><input class="commerce-input" id="account-email" name="email" type="email" autocomplete="email" required><button class="button button-burgundy" type="submit">{{ button }}</button></form>
<a class="text-link" href="{% url 'accounts:login' %}">Back to sign in</a>
{% endblock %}
